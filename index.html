
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061329">
<title>Senator Captain Pro</title>

<style>
:root{
--bg:#061329;
--panel:#102344;
--accent:#13d7ff;
--edge:#168cff;
--glow:rgba(0,190,255,.4);
}
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Arial,system-ui,sans-serif}
button,input,select{font:inherit}
button{color:inherit;touch-action:manipulation;cursor:pointer}

#app{
height:100dvh;
height:100svh;
width:100%;
max-width:560px;
margin:auto;
padding:env(safe-area-inset-top) 7px env(safe-area-inset-bottom);
display:grid;
grid-template-rows:54px minmax(0,1fr);
gap:6px;
overflow:hidden;
}

header{
display:grid;
grid-template-columns:42px minmax(0,1fr) 38px 42px;
align-items:center;
gap:7px;
padding:4px 7px;
border:1px solid var(--edge);
border-radius:15px;
background:linear-gradient(135deg,#142b4e,#07152d);
box-shadow:0 0 14px var(--glow);
}

.brand{text-align:center;line-height:1.03;min-width:0}
.brand strong{font-size:clamp(16px,4.8vw,22px);font-style:italic;letter-spacing:.5px;text-shadow:0 0 9px var(--accent)}
.brand small{display:block;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:1.2px}

.headbtn{
height:38px;
border-radius:12px;
border:1px solid #5b9fe4;
background:linear-gradient(145deg,#164b91,#091a38);
box-shadow:0 3px 0 #020817,0 0 9px var(--glow);
font-size:19px;
}
.headbtn.power{background:linear-gradient(145deg,#ff5369,#a9002a)}
.headbtn.edit.active{background:linear-gradient(145deg,#ffca3b,#9c5700);color:#1b1300}

#remote{
min-height:0;
display:grid;
grid-template-rows:36px minmax(0,1.18fr) 44px 44px minmax(105px,.92fr) 54px 42px 42px 42px 42px;
gap:5px;
padding:7px;
border-radius:19px;
border:1px solid var(--edge);
background:linear-gradient(155deg,#152b4d,#07152c 62%,#111b39);
box-shadow:0 0 18px var(--glow);
overflow:hidden;
}

.row{display:grid;gap:5px;min-height:0}
.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}

.key{
min-width:0;
min-height:0;
border:1px solid #6e94c4;
border-radius:11px;
padding:2px 1px;
background:linear-gradient(155deg,#38577f 0%,#172d4e 38%,#08162e 100%);
box-shadow:inset 0 1px 2px #ffffff55,0 3px 0 #020916,0 0 7px var(--glow);
font-weight:850;
font-size:clamp(10px,3vw,15px);
line-height:1.05;
text-align:center;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:1px;
overflow:hidden;
}
.key:active{transform:translateY(2px);filter:brightness(1.35)}
.key.red{background:linear-gradient(145deg,#ff586b,#a9002b);border-color:#ff9cac}
.key.green{background:linear-gradient(145deg,#1be6a0,#006b4b);border-color:#69ffc7}
.key.yellow{background:linear-gradient(145deg,#ffe05a,#b46a00);border-color:#fff0a0;color:#241600}
.key.blue{background:linear-gradient(145deg,#27b7ff,#0645b6);border-color:#91eaff}
.key .subtxt{font-size:8px;color:#b9d8f4;font-weight:600}

.numgrid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
grid-template-rows:repeat(4,minmax(0,1fr));
gap:5px;
min-height:0;
}
.numgrid .key{font-size:clamp(17px,5vw,25px);border-radius:13px}
.numgrid .key.smallnum{font-size:clamp(10px,3vw,14px)}

.functionrow .key{font-size:clamp(9px,2.8vw,13px)}
.colorrow .key{font-size:clamp(10px,3vw,14px)}

.navarea{
display:grid;
grid-template-columns:.8fr 1.7fr .8fr;
gap:5px;
min-height:0;
}
.navside{display:grid;grid-template-rows:1fr 1fr;gap:5px}

.dpad{
display:grid;
grid-template:1fr 1fr 1fr/1fr 1fr 1fr;
gap:4px;
padding:4px;
border-radius:50%;
background:radial-gradient(circle,#1c477a,#06152c);
border:2px solid var(--accent);
box-shadow:0 0 12px var(--glow);
min-height:0;
}
.dpad .key{
border-radius:40%;
font-size:clamp(15px,5vw,24px);
background:linear-gradient(145deg,#375b89,#0a1c38);
}
.dpad .up{grid-area:1/2}
.dpad .left{grid-area:2/1}
.dpad .ok{
grid-area:2/2;
border-radius:50%;
background:radial-gradient(circle,#078fff,#071b57);
border:2px solid #67eaff;
font-size:clamp(15px,4.8vw,23px);
box-shadow:0 0 13px #00bfff;
}
.dpad .right{grid-area:2/3}
.dpad .down{grid-area:3/2}

.volumearea{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:5px;
min-height:0;
}
.volumearea .key{font-size:clamp(9px,2.7vw,13px)}
.tall{font-size:clamp(12px,3.6vw,18px)!important}
.midpair{display:grid;grid-template-rows:1fr 1fr;gap:5px}
.media .key{font-size:clamp(15px,4vw,20px)}
.misc .key{font-size:clamp(10px,3vw,14px)}

.hidden-key{display:none!important}

.modal{
position:fixed;
inset:0;
z-index:10;
background:#020817dc;
display:none;
align-items:center;
justify-content:center;
padding:14px;
}
.modal.show{display:flex}

.dialog{
width:min(100%,420px);
max-height:88dvh;
overflow:auto;
padding:15px;
border:1px solid var(--accent);
border-radius:18px;
background:linear-gradient(145deg,#19365e,#07152c);
box-shadow:0 0 24px var(--glow);
}
.dialog h2{font-size:18px;margin:0 0 12px}
.dialog h3{font-size:14px;margin:14px 0 7px;color:var(--accent)}
.field{display:block;margin:9px 0}
.field span{display:block;font-size:12px;color:#c8dcf5;margin-bottom:5px}
.field input,.field select{
width:100%;
padding:10px;
border:1px solid #5279a8;
border-radius:9px;
background:#06152c;
color:white;
}
.field input[type=checkbox]{width:auto}
.field input[dir=ltr]{direction:ltr;text-align:center}

.actions{display:flex;gap:7px;margin-top:13px}
.actions button,.smallbtn{
flex:1;
padding:10px;
border:1px solid #5ba8e9;
border-radius:9px;
background:linear-gradient(145deg,#1678d4,#09366d);
font-weight:800;
}
.actions .secondary{background:#344761;border-color:#657b98}

.themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.themegrid button{
padding:10px 2px;
border-radius:9px;
border:1px solid #6b8eb9;
background:#10294b;
font-size:11px;
}

.codebox{
max-height:150px;
overflow:auto;
padding:8px;
border:1px solid #395d87;
border-radius:9px;
background:#061329;
font-size:11px;
line-height:1.7;
}
.codeitem{
display:flex;
justify-content:space-between;
gap:8px;
border-bottom:1px solid #ffffff18;
padding:4px 0;
}
#bissList{display:grid;gap:6px}
.bissitem{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:7px;
background:#07162d;
border-radius:8px;
font-size:11px;
}
#toast{
position:fixed;
z-index:30;
bottom:12px;
left:10px;
right:10px;
width:fit-content;
max-width:calc(100% - 20px);
margin:auto;
padding:10px 15px;
border:1px solid var(--accent);
border-radius:11px;
background:#10274a;
color:white;
font-size:12px;
opacity:0;
visibility:hidden;
transition:.2s;
pointer-events:none;
}
#toast.show{opacity:1;visibility:visible}

@media(max-height:700px){
#app{grid-template-rows:48px minmax(0,1fr);gap:4px;padding-left:4px;padding-right:4px}
header{padding:3px 6px}
#remote{grid-template-rows:30px minmax(0,1.1fr) 37px 37px minmax(90px,.88fr) 46px 36px 36px 36px 36px;gap:4px;padding:5px}
.key{border-radius:8px}
.numgrid .key{border-radius:10px}
}
@media(max-width:360px){
#remote{gap:3px;padding:4px}
.row,.navarea,.volumearea{gap:3px}
.key{font-size:9px}
.numgrid .key{font-size:17px}
}
</style>
</head>

<body>
<div id="app">

<header>
<button class="headbtn" onclick="send('23','MUTE')">🔇</button>
<div class="brand">
<strong>SENATOR</strong>
<small>CAPTAIN PRO</small>
</div>
<button class="headbtn" onclick="openSettings()">⚙</button>
<button class="headbtn edit" id="editToggle" onclick="toggleEdit()">✎</button>
</header>

<div id="remote">

<div class="row four">
<button class="key" data-id="sat">SAT</button>
<button class="key" data-id="tvr">TV/R</button>
<button class="key" data-id="timer">TIMER</button>
<button class="key" data-id="mode">MODE</button>
</div>

<div class="numgrid">
<button class="key" data-id="n1">1</button>
<button class="key" data-id="n2">2</button>
<button class="key" data-id="n3">3</button>
<button class="key" data-id="n4">4</button>
<button class="key" data-id="n5">5</button>
<button class="key" data-id="n6">6</button>
<button class="key" data-id="n7">7</button>
<button class="key" data-id="n8">8</button>
<button class="key" data-id="n9">9</button>
<button class="key smallnum" data-id="recall">RECALL</button>
<button class="key" data-id="n0">0</button>
<button class="key" data-id="p1">P1</button>
</div>

<div class="row four functionrow">
<button class="key" data-id="sub">SUB</button>
<button class="key" data-id="zoom">ZOOM</button>
<button class="key" data-id="motor">MOTOR</button>
<button class="key" data-id="txt">TXT</button>
</div>

<div class="row four colorrow">
<button class="key red" data-id="audio">AUDIO</button>
<button class="key green" data-id="app">APP</button>
<button class="key yellow" data-id="wifi">📶 WiFi</button>
<button class="key blue" data-id="info">INFO</button>
</div>

<div class="navarea">
<div class="navside">
<button class="key" data-id="menu">MENU</button>
<button class="key" data-id="sat2">SAT</button>
</div>

<div class="dpad">
<button class="key up" data-id="up">▲</button>
<button class="key left" data-id="left">◀</button>
<button class="key ok" data-id="ok">OK</button>
<button class="key right" data-id="right">▶</button>
<button class="key down" data-id="down">▼</button>
</div>

<div class="navside">
<button class="key" data-id="exit">EXIT</button>
<button class="key" data-id="find">FIND</button>
</div>
</div>

<div class="volumearea">
<button class="key tall" data-id="vol">＋<span class="subtxt">VOL</span>－</button>
<div class="midpair">
<button class="key" data-id="fav">FAV</button>
<button class="key" data-id="ipkey">IP</button>
</div>
<button class="key tall" data-id="page">＋<span class="subtxt">PAGE</span>－</button>
</div>

<div class="row four misc">
<button class="key" data-id="hd">HD</button>
<button class="key" data-id="epg">EPG</button>
<button class="key" data-id="pausekey">PAUSE</button>
<button class="key" data-id="sw">SW</button>
</div>

<div class="row four media">
<button class="key" data-id="rewind">◀◀</button>
<button class="key" data-id="fast">▶▶</button>
<button class="key" data-id="previous">|◀</button>
<button class="key" data-id="next">▶|</button>
</div>

<div class="row four media">
<button class="key" data-id="play">▶</button>
<button class="key" data-id="pause">Ⅱ</button>
<button class="key" data-id="stop">■</button>
<button class="key red" data-id="record">●</button>
</div>

<div class="row four misc">
<button class="key" data-id="f2">F2</button>
<button class="key" data-id="f3">F3</button>
<button class="key" data-id="usb">USB</button>
<button class="key" data-id="help">HELP</button>
</div>

</div>
</div>

<!-- الإعدادات -->
<div class="modal" id="settingsModal" onclick="if(event.target===this)closeModal('settingsModal')">
<div class="dialog">
<h2>⚙ إعدادات Senator Captain Pro</h2>

<h3>الاتصال بالرسيفر</h3>
<label class="field">
<span>عنوان IP</span>
<input id="ip" inputmode="decimal" value="192.168.1.18" dir="ltr">
</label>

<div class="codebox">
منفذ G-MScreen: <b>20000</b><br>
الاتصال TCP مباشر، ويبدأ عند الضغط على أول زر تحكم.
</div>

<h3>الثيمات</h3>
<div class="themegrid">
<button onclick="setTheme('blue')">أزرق ملكي</button>
<button onclick="setTheme('purple')">بنفسجي</button>
<button onclick="setTheme('red')">أحمر</button>
<button onclick="setTheme('green')">زمردي</button>
<button onclick="setTheme('gold')">ذهبي</button>
<button onclick="setTheme('cyan')">سماوي</button>
</div>

<h3>أكواد الأزرار المعروفة حاليًا</h3>
<div class="codebox" id="knownCodes"></div>

<h3>إدارة مفاتيح BISS</h3>
<label class="field">
<span>اسم القناة / التردد</span>
<input id="bissName" placeholder="اسم القناة أو التردد">
</label>
<label class="field">
<span>مفتاح BISS</span>
<input id="bissKey" placeholder="أدخل المفتاح يدويًا" dir="ltr">
</label>
<button class="smallbtn" onclick="addBiss()">حفظ مفتاح BISS محليًا</button>
<div id="bissList"></div>

<div class="actions">
<button onclick="saveSettings()">حفظ الإعدادات</button>
<button class="secondary" onclick="closeModal('settingsModal')">إغلاق</button>
</div>
</div>
</div>

<!-- تعديل الأزرار -->
<div class="modal" id="editModal" onclick="if(event.target===this)closeModal('editModal')">
<div class="dialog">
<h2>✎ تعديل الزر</h2>

<label class="field">
<span>اسم الزر الظاهر</span>
<input id="editLabel">
</label>

<label class="field">
<span>كود الأمر الذي يرسله للرسيفر</span>
<input id="editCode" inputmode="numeric" dir="ltr" placeholder="اتركه فارغًا إذا لم يُعرف الكود">
</label>

<label class="field">
<span>لون الزر</span>
<select id="editColor">
<option value="">افتراضي</option>
<option value="red">أحمر</option>
<option value="green">أخضر</option>
<option value="yellow">أصفر</option>
<option value="blue">أزرق</option>
</select>
</label>

<label class="field">
<span><input id="editHidden" type="checkbox"> إخفاء هذا الزر من الريموت</span>
</label>

<div class="actions">
<button onclick="saveButtonEdit()">حفظ التعديل</button>
<button class="secondary" onclick="closeModal('editModal')">إلغاء</button>
</div>
</div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=id=>document.getElementById(id);

const defaults={
sat:{label:'SAT',code:''},
tvr:{label:'TV/R',code:''},
timer:{label:'TIMER',code:''},
mode:{label:'MODE',code:''},

n1:{label:'1',code:'13'},n2:{label:'2',code:'14'},n3:{label:'3',code:'15'},
n4:{label:'4',code:'16'},n5:{label:'5',code:'17'},n6:{label:'6',code:'18'},
n7:{label:'7',code:'19'},n8:{label:'8',code:'20'},n9:{label:'9',code:'21'},
recall:{label:'RECALL',code:''},n0:{label:'0',code:'0'},p1:{label:'P1',code:''},

sub:{label:'SUB',code:'31'},zoom:{label:'ZOOM',code:''},
motor:{label:'MOTOR',code:''},txt:{label:'TXT',code:''},

audio:{label:'AUDIO',code:'54',color:'red'},
app:{label:'APP',code:'',color:'green'},
wifi:{label:'📶 WiFi',code:'',color:'yellow'},
info:{label:'INFO',code:'57',color:'blue'},

menu:{label:'MENU',code:'6'},
sat2:{label:'SAT',code:''},
up:{label:'▲',code:'1'},
left:{label:'◀',code:'3'},
ok:{label:'OK',code:'5'},
right:{label:'▶',code:'4'},
down:{label:'▼',code:'2'},
exit:{label:'EXIT',code:'7'},
find:{label:'FIND',code:''},

vol:{label:'＋ VOL －',code:'35'},
fav:{label:'FAV',code:'33'},
ipkey:{label:'IP',code:''},
page:{label:'＋ PAGE －',code:'52'},

hd:{label:'HD',code:''},
epg:{label:'EPG',code:'32'},
pausekey:{label:'PAUSE',code:''},
sw:{label:'SW',code:''},

rewind:{label:'◀◀',code:''},
fast:{label:'▶▶',code:''},
previous:{label:'|◀',code:''},
next:{label:'▶|',code:''},
play:{label:'▶',code:''},
pause:{label:'Ⅱ',code:''},
stop:{label:'■',code:''},
record:{label:'●',code:''},

f2:{label:'F2',code:'9'},
f3:{label:'F3',code:'10'},
usb:{label:'USB',code:'43'},
help:{label:'HELP',code:''},

mute:{label:'MUTE',code:'23'},
power:{label:'POWER',code:'42'}
};

function load(key,fallback){
try{
const value=localStorage.getItem(key);
return value?JSON.parse(value):JSON.parse(JSON.stringify(fallback));
}catch(e){
return JSON.parse(JSON.stringify(fallback));
}
}

let buttons=load('scp_buttons',defaults);
let editing=false;
let selectedId=null;
let toastTimer=null;

function persist(){
localStorage.setItem('scp_buttons',JSON.stringify(buttons));
}

function toast(message){
const t=$('toast');
t.textContent=message;
t.classList.add('show');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

function paintButtons(){
document.querySelectorAll('[data-id]').forEach(el=>{
const id=el.dataset.id;
const b=buttons[id]||defaults[id];
if(!b)return;

el.textContent=b.label;
el.classList.toggle('hidden-key',!!b.hidden);

['red','green','yellow','blue'].forEach(c=>el.classList.remove(c));
if(b.color)el.classList.add(b.color);

el.title=editing?'اضغط لتعديل '+b.label:'';
el.style.outline=editing?'1px dashed #ffd45a':'';
});
}

function toggleEdit(){
editing=!editing;
$('editToggle').classList.toggle('active',editing);
toast(editing?
'وضع التعديل: اضغط على أي زر لتغيير اسمه أو كوده أو لونه أو إخفائه':
'تم إغلاق وضع التعديل');
}

function openEditor(id){
selectedId=id;
const b=buttons[id]||{label:id,code:''};

$('editLabel').value=b.label;
$('editCode').value=b.code??'';
$('editColor').value=b.color||'';
$('editHidden').checked=!!b.hidden;

$('editModal').classList.add('show');
}

function saveButtonEdit(){
if(!selectedId)return;

const b=buttons[selectedId]||{};

b.label=$('editLabel').value.trim()||selectedId;
b.code=$('editCode').value.trim();
b.color=$('editColor').value;
b.hidden=$('editHidden').checked;

buttons[selectedId]=b;
persist();
paintButtons();
closeModal('editModal');
toast('تم حفظ تعديل الزر على الهاتف');
}

function closeModal(id){
$(id).classList.remove('show');
}

document.querySelectorAll('[data-id]').forEach(el=>{
el.addEventListener('click',()=>{
const id=el.dataset.id;

if(editing){
openEditor(id);
return;
}

const b=buttons[id];
if(!b||b.hidden)return;

sendButton(b);
});
});

function sendButton(b){
const code=(b.code??'').toString().trim();

if(!code){
toast('كود هذا الزر غير معروف بعد. فعّل وضع التعديل لإدخال الكود الصحيح.');
return;
}

send(code,b.label);
}

function send(code,label){
if(navigator.vibrate)navigator.vibrate(15);

if(!window.Captain){
toast('جسر الاتصال الأصلي غير متاح');
return;
}

const ip=Captain.getSavedIp();

if(!validIp(ip)){
toast('عنوان IP غير صحيح؛ افتح الإعدادات');
return;
}

if(typeof Captain.sendKey==='function'){
Captain.sendKey(ip,String(code),label||'زر');
}
}

function validIp(ip){
const p=ip.split('.');
return p.length===4&&p.every(x=>
/^\d{1,3}$/.test(x)&&Number(x)>=0&&Number(x)<=255
);
}

function openSettings(){
$('ip').value=window.Captain?
Captain.getSavedIp():
'192.168.1.18';

$('settingsModal').classList.add('show');
renderKnown();
renderBiss();
}

function saveSettings(){
const ip=$('ip').value.trim();

if(!validIp(ip)){
toast('عنوان IP غير صحيح');
return;
}

if(window.Captain){
Captain.saveIp(ip);
}

localStorage.setItem('scp_ip',ip);
toast('تم حفظ عنوان IP');
closeModal('settingsModal');
}

function setTheme(name){
const themes={
blue:['#061329','#102344','#13d7ff','#168cff'],
purple:['#160b2b','#25143f','#d18aff','#8846d8'],
red:['#210b19','#351326','#ff719c','#bd315c'],
green:['#061e1b','#10352d','#4dffc0','#238d6d'],

function renderKnown(){
$('knownCodes').innerHTML=
Object.entries(codeNames).map(([code,name])=>
'<div class="codeitem"><span>'+name+'</span><b dir="ltr">'+code+'</b></div>'
).join('')+
'<div style="margin-top:6px;color:#ffd36a">هذه الأكواد المنقولة من خريطة الأزرار الحالية، وليست تأكيدًا بأن كل زر جديد قد تم اختباره.</div>';
}

function getBiss(){
return load('scp_biss',[]);
}

function addBiss(){
const name=$('bissName').value.trim();
const key=$('bissKey').value.trim();

if(!name||!key){
toast('أدخل اسم القناة ومفتاح BISS');
return;
}

const list=getBiss();
list.push({name,key});

localStorage.setItem('scp_biss',JSON.stringify(list));

$('bissName').value='';
$('bissKey').value='';

renderBiss();
toast('تم حفظ المفتاح محليًا');
}

function renderBiss(){
const list=getBiss();

$('bissList').innerHTML=list.map((x,i)=>
'<div class="bissitem"><span>'+
escapeHtml(x.name)+'<br><b dir="ltr">'+
escapeHtml(x.key)+'</b></span>'+
'<button class="smallbtn" style="flex:0 0 auto;padding:6px 9px" onclick="deleteBiss('+i+')">حذف</button></div>'
).join('')||
'<div style="padding:8px;color:#9db6d8">لا توجد مفاتيح محفوظة</div>';
}

function deleteBiss(i){
const list=getBiss();
list.splice(i,1);
localStorage.setItem('scp_biss',JSON.stringify(list));
renderBiss();
}

function escapeHtml(s){
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}
function nativeResult(ok,msg){
if(ok){
toast('✓ '+msg);
}else if(msg&&msg.includes('جاري الاتصال')){
toast(msg);
}else{
toast('✕ '+msg);
}
}

function applySavedTheme(){
const name=localStorage.getItem('scp_theme');
if(name)setTheme(name);
}

paintButtons();
applySavedTheme();

document.addEventListener('keydown',e=>{
if(e.key==='Escape'){
closeModal('settingsModal');
closeModal('editModal');
}
});
</script>
