name: Build Senator Captain Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project structure from flat files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/senator/captainpro
          mkdir -p app/src/main/assets

          cp MainActivity.java app/src/main/java/com/senator/captainpro/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app.gradle app/build.gradle
          cp root.gradle build.gradle

          test -s settings.gradle
          test -s gradle.properties
          test -s app/src/main/java/com/senator/captainpro/MainActivity.java
          test -s app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SenatorCaptainPro-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
